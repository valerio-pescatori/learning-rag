[project]
name = "rag-playground"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "valerio-pescatori", email = "pescatorim14@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.5.2",
    "langchain-chroma>=1.1.0",
    "langchain-openai>=1.8.5",
    "langchain-text-splitters>=1.1.3",
    "python-dotenv>=1.2.4",
]

[project.scripts]
rag-playground = "rag_playground:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
